<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title|default('Bandwidth Optimizer') }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-nav">
    <div class="container"><a class="navbar-brand fw-semibold" href="{{ url_for('main.dashboard') }}">◉ NetOpt AI</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto"><a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('main.traffic') }}">Traffic</a><a class="nav-link" href="{{ url_for('main.allocation') }}">QoS Allocation</a><a class="nav-link" href="{{ url_for('api.export_traffic') }}">Export CSV</a></div></div></div>
  </nav>
  <main class="container py-5">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
